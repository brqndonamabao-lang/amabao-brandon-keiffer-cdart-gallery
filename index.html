<!doctype html>
<html lang="en">
  <head>
    <!--
      ============================================================
      VIDEO PART 3 - DEVELOPMENT SETUP AND STRUCTURE
      TOPIC 1 OF 4: index.html (the shell of the website)
      ------------------------------------------------------------
      Hello everyone. This is index.html. It is the only real HTML
      file in the project. When the browser opens the website, this
      is the first file it reads.

      The <head> part is information ABOUT the page. You do not see
      it on the page itself. It gives the browser the title you see
      on the tab, the small icon (favicon), and a description for
      search engines. The <title> tag is the words on the browser
      tab. The <meta> tags are extra information for the browser.

      The <body> part is what people actually see. Inside it there
      is an empty box: <div id="root"></div>. That box is empty on
      purpose. React will fill it with the whole gallery.

      At the bottom, the <script> tag starts React. In the source
      code it points to /src/main.jsx. The production build replaces
      it with one bundled file. That is how the browser knows to
      run our React code.

      So the story is: index.html gives the browser a title, an
      icon, and an empty box called root. React takes over from
      there. The next topic is src/main.jsx, which is the file that
      finds that box and starts React inside it.
      ============================================================
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CDArt Gallery - a quiet, story-driven gallery where artists turn a small collection of work into one card, and visitors follow the art they love."
    />
    <meta name="author" content="Brandon Keiffer Amabao" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b1224" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CDArt Gallery | Card Gallery for Artists</title>

    <!--
      ============================================================
      VIDEO PART 4 - STYLING AND LAYOUT
      EXAMPLE 1 OF 3: internal CSS (a <style> block in the head)
      ------------------------------------------------------------
      This tiny style block colours the thin scroll bar at the very
      top of the page. It lives here instead of App.css because the
      bar sits outside React, so its style stays next to its script.

      Two CSS rules can disagree about the same thing. When that
      happens, the more specific selector wins. An ID selector
      (#scroll-progress) is stronger than a class selector
      (.scroll-progress), so this blue-to-yellow colour wins over
      the grey colour in App.css.

      The width is not set here. It is set inline on the element
      below, because JavaScript changes the width while you scroll.
      ============================================================
    -->
    <style>
      #scroll-progress {
        background: linear-gradient(90deg, #3b5fa8, #ffd166);
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <!--
      ============================================================
      VIDEO PART 4 - STYLING AND LAYOUT
      EXAMPLE 2 OF 3: inline CSS (the style="" attribute)
      ------------------------------------------------------------
      Inline CSS is the strongest of the three methods, but it is
      hard to reuse. We only use it here for the starting width,
      because JavaScript changes the width as you scroll.
      aria-hidden="true" hides this decoration from screen readers.
      ============================================================
    -->
    <div id="scroll-progress" class="scroll-progress" style="width: 0%" aria-hidden="true"></div>

    <!--
      ============================================================
      VIDEO PART 8 - FINAL WEBSITE WALKTHROUGH
      ------------------------------------------------------------
      This is the empty box from Part 3. When you open the site,
      React puts everything inside it: the top bar, the welcome
      area, the gallery, the post form, the About section, the
      footer, and the pop-ups.

      Show this in the browser, then open DevTools (F12) and point
      at #root. Say: "Everything I built is inside this one box."
      ============================================================
    -->
    <div id="root"></div>

    <noscript>
      <p
        style="
          max-width: 640px;
          margin: 2rem auto;
          padding: 1rem;
          font-family: system-ui, sans-serif;
          color: #17203a;
          background: #fffdf9;
          border: 1px solid #e2d9cc;
          border-radius: 14px;
          text-align: center;
        "
      >
        CDArt Gallery needs JavaScript to show the cards. Please enable JavaScript and reload.
      </p>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
    <script src="/dom-demo.js"></script>

</html>
