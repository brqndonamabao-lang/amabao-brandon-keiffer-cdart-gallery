<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Responsive check</title>
    <style>
      body { margin: 0; display: flex; gap: 16px; align-items: flex-start; font-family: system-ui, sans-serif; }
      figure { margin: 0; }
      figcaption { font-size: 12px; padding: 4px; }
      iframe { border: 2px solid #333; height: 780px; display: block; }
    </style>
  </head>
  <body>
    <figure><figcaption>375px</figcaption><iframe id="p375" src="./" style="width: 375px"></iframe></figure>
    <figure><figcaption>768px</figcaption><iframe id="p768" src="./" style="width: 768px"></iframe></figure>
    <figure><figcaption>1200px</figcaption><iframe id="p1200" src="./" style="width: 1200px"></iframe></figure>
  </body>
</html>
